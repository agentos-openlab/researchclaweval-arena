name: Framework adapter proposal
description: Propose a portable adapter for the public benchmark
title: "adapter: <framework name>"
labels: [adapter]
body:
  - type: markdown
    attributes:
      value: |
        Describe the adapter route and the framework's native launch flow.
        Do not include API keys, private URLs, or local data paths. See
        `docs/participant_quickstart.md` and `templates/example-adapter/`.
  - type: input
    attributes:
      label: Proposed adapter ID
      description: Lowercase slug matching the name used in adapter.json
    validations:
      required: true
  - type: input
    id: framework_name
    attributes:
      label: Framework name
    validations:
      required: true
  - type: input
    id: upstream
    attributes:
      label: Upstream repository URL
      placeholder: "https://github.com/..."
    validations:
      required: true
  - type: textarea
    id: entrypoint
    attributes:
      label: Native launch command
      description: Docker image, command, and source of the native marker
    validations:
      required: true
  - type: dropdown
    id: topics
    attributes:
      label: Supported topics
      multiple: true
      options:
        - babylm
        - mountaincar_continuous
        - arc_wbe_2026
        - psydefdetect
        - tdc_admet_tox
    validations:
      required: true
  - type: checkboxes
    id: native
    attributes:
      label: Native-execution guarantees
      options:
        - label: The framework emits its declared native marker itself
        - label: The framework can read OPENAI_BASE_URL / OPENAI_API_KEY / OPENAI_MODEL from its environment
        - label: The framework writes the topic's required artifacts in /workspace
  - type: textarea
    id: evidence
    attributes:
      label: Verification status and evidence
      description: State which topic routes were launched and what remains unverified.
